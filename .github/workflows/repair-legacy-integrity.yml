name: Restore legacy plugin integrity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-legacy-v010
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery archive and tests
        run: |
          python3 scripts/restore-legacy-release.py
          python3 -m unittest discover -s apps/mobile/scripts -p 'test_legacy_release.py'
      - name: Restore original download and preserve republication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/restore-legacy-release.py --apply
